<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ファイターカルテ{% endblock %}</title>
  <!-- CSS は手書きのみ(フレームワーク不使用)。パスは url_for。 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="{{ url_for('index') }}">SF6 ファイターカルテ</a>
      <nav>
        <a href="{{ url_for('index') }}">一覧</a>
        <a class="btn-primary" href="{{ url_for('create') }}">＋ 新規登録</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- flash メッセージ(PRG の結果表示) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">数値は Buckler's Boot Camp を見ながら手入力 / 診断はルールベース</div>
  </footer>
</body>
</html>
